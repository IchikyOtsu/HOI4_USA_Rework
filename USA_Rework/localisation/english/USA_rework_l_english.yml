 USA_rework.1.t: "A Fireside Chat"
 USA_rework.1.d: "The President addresses American homes directly as the foreign-policy debate deepens."
 USA_rework.1.a: "We must become the arsenal of democracy."
 USA_rework.1.b: "No American boys will be sent abroad."
 USA_rework.2.t: "The Midterm Campaign"
 USA_rework.2.d: "The voters judge recovery, reform, and the government's conduct abroad."
 USA_rework.2.a: "The voters renew their confidence."
 USA_rework.2.b: "The opposition gains ground."
 USA_rework.10.t: "France Nears Defeat"
 USA_rework.10.d: "The collapse of the French Army transforms the American debate."
 USA_rework.10.a: "America must prepare."
 USA_rework.11.t: "War in the Pacific"
 USA_rework.11.d: "Japanese forces have engaged the United States. The country now demands complete victory."
 USA_rework.11.a: "The giant is awake."
 USA_rework.12.t: "The Quarantine Speech"
 USA_rework.12.d: "Faced with mounting aggression, the President suggests that peace-loving nations collectively quarantine the aggressors."
 USA_rework.12.a: "Aggressors must no longer act with impunity."
 USA_rework.12.b: "This moves us dangerously close to war."
 USA_rework.13.t: "War Breaks Out in Europe"
 USA_rework.13.d: "Germany is once again at war with its neighbors. Congress and the public must reconsider whether neutrality can keep America safe."
 USA_rework.13.a: "Prepare to support the democracies."
 USA_rework.13.b: "This is not our war."
