 # Military extension
 USA_rework_army_ground_forces: "Establish the Army Ground Forces"
 USA_rework_army_ground_forces_desc: "A unified ground command will coordinate the training, equipment, and expansion of the Army."
 USA_rework_strategic_air_forces: "Organize the Strategic Air Forces"
 USA_rework_strategic_air_forces_desc: "American air power must strike enemy industry far beyond the front."
 USA_rework_carrier_task_forces: "Carrier Task Forces"
 USA_rework_carrier_task_forces_desc: "The carrier will become the core of fast naval groups operating throughout the Pacific."
 USA_rework_combined_arms_doctrine: "Combined Arms Doctrine"
 USA_rework_combined_arms_doctrine_desc: "Infantry, armor, artillery, and aircraft must operate as one force."
 USA_rework_strategic_bombing_campaign: "Prepare the Strategic Bombing Campaign"
 USA_rework_strategic_bombing_campaign_desc: "A systematic air offensive will deprive the enemy of its industrial capacity."
 USA_rework_amphibious_warfare: "Master Amphibious Warfare"
 USA_rework_amphibious_warfare_desc: "The Marines and Navy will prepare the landings required for an overseas war."
 USA_rework_war_plans_division: "War Plans Division"
 USA_rework_war_plans_division_desc: "A permanent division will maintain plans for every potential adversary."

 # Landon and conservative recovery
 USA_rework_elect_alf_landon: "Elect Alf Landon"
 USA_rework_elect_alf_landon_desc: "Landon promises constitutional government, private enterprise, and restraint abroad."
 USA_rework_restore_gold_standard: "Restore the Gold Standard"
 USA_rework_restore_gold_standard_desc: "Tying the dollar to gold will reassure creditors at the cost of fiscal flexibility."
 USA_rework_unleash_private_enterprise: "Unleash Private Enterprise"
 USA_rework_unleash_private_enterprise_desc: "Private investment will replace the largest federal recovery programs."
 USA_rework_hemisphere_trade_bloc: "Hemisphere Trade Bloc"
 USA_rework_hemisphere_trade_bloc_desc: "Prosperity in the Americas can secure the nation without European entanglements."

 # Postwar and Cold War
 USA_rework_fair_deal: "The Fair Deal"
 USA_rework_fair_deal_desc: "Extend the social reforms of the New Deal to veterans and American families."
 USA_rework_occupation_zones: "Administer the Occupation Zones"
 USA_rework_occupation_zones_desc: "Victory leaves the United States responsible for stabilizing the defeated territories."
 USA_rework_truman_doctrine_focus: "The Truman Doctrine"
 USA_rework_truman_doctrine_focus_desc: "We will support free peoples threatened by totalitarian coercion."
 USA_rework_interstate_highway_system: "Interstate Highway System"
 USA_rework_interstate_highway_system_desc: "A modern continental network will serve both prosperity and national defense."
 USA_rework_democratize_defeated_powers: "Democratize the Defeated Powers"
 USA_rework_democratize_defeated_powers_desc: "Reconstruction must turn former enemies into stable democracies."
 USA_rework_berlin_airlift_focus: "The Berlin Airlift"
 USA_rework_berlin_airlift_focus_desc: "We will supply Berlin for as long as necessary to break the blockade."
 USA_rework_atoms_for_peace_focus: "Atoms for Peace"
 USA_rework_atoms_for_peace_focus_desc: "American nuclear power must also serve science and civilian energy."
 USA_rework_nsc_68_focus: "Adopt NSC-68"
 USA_rework_nsc_68_focus_desc: "The Soviet confrontation requires sustained economic and military rearmament."
 USA_rework_space_program: "A National Space Program"
 USA_rework_space_program_desc: "Rockets, satellites, and advanced research will open a new American frontier."
 USA_rework_korean_commitment: "The Korean Commitment"
 USA_rework_korean_commitment_desc: "Aggression in Korea would test the entire policy of containment."

 # Alternative-path conclusions
 USA_rework_peoples_commonwealth: "The People's Commonwealth"
 USA_rework_peoples_commonwealth_desc: "The new republic will unite workers, minorities, and communities in an American socialist order."
 USA_rework_workers_arsenal: "The Workers' Arsenal"
