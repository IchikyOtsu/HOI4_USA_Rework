l_english:
 USA_rework_recovery: "Renew the Nation"
 USA_rework_recovery_desc: "The United States will emerge from the crisis through determined federal action."
 USA_rework_public_works: "Federal Public Works"
 USA_rework_public_works_desc: "Mobilize national resources to modernize the country's infrastructure."
 USA_rework_arsenal_democracy: "Arsenal of Democracy"
 USA_rework_arsenal_democracy_desc: "Prepare American industry for the threats facing the free world."
 USA_rework_federal_reform: "Reform the Federation"
 USA_rework_federal_reform_desc: "Make the federal administration more efficient and legitimate."
 USA_rework_wartime_economy: "Wartime Economy"
 USA_rework_wartime_economy_desc: "Make American industry the engine of victory."
 USA_rework_industrial_mobilization: "Industrial Mobilization"
 USA_rework_economic_programs: "American Reconstruction Program"
 USA_rework_expand_public_works: "Expand Public Works"
 USA_rework_expand_public_works_desc: "Fund a new wave of federal investment."

 USA_rework_new_deal_continues: "The New Deal Continues"
 USA_rework_new_deal_continues_desc: "Federal action will continue the recovery while preparing the nation for the crises ahead."
 USA_rework_wpa: "Works Progress Administration"
 USA_rework_wpa_desc: "Federal public works will put Americans back to work and modernize the country."
 USA_rework_social_security: "Strengthen Social Security"
 USA_rework_social_security_desc: "Lasting protection against old age and unemployment will strengthen the American social contract."
 USA_rework_agricultural_adjustment: "Agricultural Adjustment Act"
 USA_rework_agricultural_adjustment_desc: "Stable agricultural prices will help rural America emerge from the Depression."
 USA_rework_fair_labor_standards: "Fair Labor Standards Act"
 USA_rework_fair_labor_standards_desc: "Federal wages and labor standards will allow workers to share in the recovery."
 USA_rework_scientific_office: "Office of Scientific Research"
 USA_rework_scientific_office_desc: "The government must coordinate universities, industry, and strategic research."
 USA_rework_manhattan_groundwork: "Atomic Groundwork"
 USA_rework_manhattan_groundwork_desc: "Advances in nuclear physics demand a discreet but ambitious research program."
 USA_rework_neutrality_acts: "The Neutrality Acts"
 USA_rework_neutrality_acts_desc: "Congress intends to keep another European war from drawing in America."
 USA_rework_limited_intervention: "Limited Intervention"
 USA_rework_limited_intervention_desc: "Without entering the war, we can gradually support the threatened democracies."
 USA_rework_destroyers_for_bases: "Destroyers for Bases"
 USA_rework_destroyers_for_bases_desc: "Old destroyers will reinforce Britain in exchange for Atlantic base rights."
 USA_rework_reelect_roosevelt: "Reelect Roosevelt"
 USA_rework_reelect_roosevelt_desc: "In unprecedented times, the voters grant Franklin Roosevelt a third term to preserve national continuity."
 USA_rework_four_freedoms: "The Four Freedoms"
 USA_rework_four_freedoms_desc: "Freedom of speech, freedom of worship, freedom from want, and freedom from fear must guide our role in the world."
 USA_rework_lend_lease_act: "Lend-Lease Act"
 USA_rework_lend_lease_act_desc: "America will supply nations whose defense is vital to our own."
 USA_rework_arsenal_of_democracy: "Arsenal of Democracy"
 USA_rework_arsenal_of_democracy_desc: "American productive power must equip the nations resisting aggression."
 USA_rework_fortress_america: "Fortress America"
 USA_rework_fortress_america_desc: "Two oceans and immense industry can defend the continent without foreign wars."
 USA_rework_hemisphere_first: "Hemisphere First"
 USA_rework_hemisphere_first_desc: "The Monroe Doctrine remains the foundation of our collective security."
 USA_rework_continental_defense: "Continental Defense"
 USA_rework_continental_defense_desc: "Ports, airfields, and garrisons will make an attack on the continent fail."
 USA_rework_defense_industrial_base: "Defense Industrial Base"
 USA_rework_defense_industrial_base_desc: "A minimum armaments capacity must exist before the world crisis reaches our shores."
 USA_rework_giant_wakes: "The Giant Wakes"
 USA_rework_giant_wakes_desc: "American industry begins its methodical conversion to national defense."
 USA_rework_usace_projects: "USACE Projects"
 USA_rework_usace_projects_desc: "The Corps of Engineers will coordinate factories, roads, ports, and airfields."
 USA_rework_wartime_industry: "Wartime Industry"
 USA_rework_wartime_industry_desc: "A nation at war must mobilize production on an unprecedented scale."
 USA_rework_war_department: "Reorganize the War Department"
 USA_rework_war_department_desc: "A future combined war requires modern command, planning, and logistics."
 USA_rework_selective_training_act: "Selective Training and Service Act"
 USA_rework_selective_training_act_desc: "America's first peacetime draft will provide the army with the men it needs."
 USA_rework_army_modernization: "Modernize the US Army"
 USA_rework_army_modernization_desc: "Armor, motorization, and radio will transform the small army into a modern force."
 USA_rework_army_air_corps: "Expand the Army Air Corps"
 USA_rework_army_air_corps_desc: "Air superiority and aircraft production will be decisive in modern war."
 USA_rework_two_ocean_navy: "Two-Ocean Navy Act"
 USA_rework_two_ocean_navy_desc: "The fleet must fight in the Atlantic and Pacific at the same time."
 USA_rework_pacific_bases: "Fortify the Pacific Outposts"
 USA_rework_pacific_bases_desc: "Hawaii, Guam, and the Philippines are the sentinels of our forward defense."
 USA_rework_rainbow_plans: "The Rainbow Plans"
 USA_rework_rainbow_plans_desc: "The old color plans must become joint plans suited to a global war."
 USA_rework_joint_chiefs: "Joint Chiefs of Staff"
 USA_rework_joint_chiefs_desc: "Army, navy, and air forces will wage war under a common strategy."
 USA_rework_manhattan_project: "The Manhattan Project"
 USA_rework_manhattan_project_desc: "The free world's best scientists will master atomic energy before our enemies."
 USA_rework_victory_program: "Victory Program"
 USA_rework_victory_program_desc: "Our needs and those of the Allies will become a single production program."
 USA_rework_gi_bill: "GI Bill of Rights"
 USA_rework_gi_bill_desc: "Education, housing, and reintegration will help veterans build postwar America."
 USA_rework_bretton_woods: "The Bretton Woods System"
 USA_rework_bretton_woods_desc: "A stable monetary order will prevent a return to the economic rivalries of the thirties."
 USA_rework_united_nations: "Found the United Nations"
 USA_rework_united_nations_desc: "A lasting world organization must succeed the temporary alliances of wartime."
 USA_rework_orderly_demobilization: "Orderly Demobilization"
 USA_rework_orderly_demobilization_desc: "The return to peace must avoid mass unemployment and needless militarization."
 USA_rework_marshall_plan: "The Marshall Plan"
 USA_rework_marshall_plan_desc: "The economic reconstruction of free Europe is essential to its political stability."
 USA_rework_containment: "The Policy of Containment"
 USA_rework_containment_desc: "Soviet pressure must be contained through power, aid, and alliances."
 USA_rework_north_atlantic_treaty: "North Atlantic Treaty"
 USA_rework_north_atlantic_treaty_desc: "An attack on one Atlantic democracy will be treated as an attack on all."

