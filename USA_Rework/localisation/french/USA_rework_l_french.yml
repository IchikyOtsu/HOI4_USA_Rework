 USA_rework_space_program_spirit: "Programme spatial américain"
 USA_rework_space_program_spirit_desc: "L'État mobilise universités, armée et industrie pour conquérir l'espace."
 USA_rework_korean_commitment_spirit: "Engagement en Corée"
 USA_rework_korean_commitment_spirit_desc: "Les forces américaines sont préparées à défendre la péninsule."
 USA_rework_peoples_commonwealth_spirit: "Commonwealth des peuples"
 USA_rework_peoples_commonwealth_spirit_desc: "Le nouveau pacte socialiste unit les communautés de la fédération."
 USA_rework_workers_arsenal_spirit: "Arsenal des travailleurs"
 USA_rework_workers_arsenal_spirit_desc: "Les syndicats organisent une production de guerre collectivisée."
 USA_rework_revolutionary_diplomacy: "Diplomatie révolutionnaire"
 USA_rework_revolutionary_diplomacy_desc: "Les mouvements populaires du continent reçoivent l'appui de Washington."
 USA_rework_world_revolution_spirit: "Avant-garde de la révolution mondiale"
 USA_rework_world_revolution_spirit_desc: "La puissance américaine est mise au service de la révolution internationale."
 USA_rework_pacific_empire_spirit: "Empire américain du Pacifique"
 USA_rework_pacific_empire_spirit_desc: "Une flotte impériale protège nos nouvelles possessions océaniques."
 USA_rework_imperial_american_century_spirit: "Siècle impérial américain"
 USA_rework_imperial_american_century_spirit_desc: "Aucune puissance ne peut plus contester notre hégémonie."
 USA_rework_military_industrial_state_spirit: "État militaro-industriel"
 USA_rework_military_industrial_state_spirit_desc: "Les institutions militaires et industrielles forment un système permanent."
 USA_rework_guardians_republic_spirit: "Gardiens constitutionnels"
 USA_rework_guardians_republic_spirit_desc: "L'armée protège la République restaurée sans la gouverner ouvertement."
 USA_rework_permanent_emergency_spirit: "État d'urgence permanent"
 USA_rework_permanent_emergency_spirit_desc: "Les pouvoirs extraordinaires deviennent la norme du régime."
 USA_rework_american_protectorates_spirit: "Réseau de protectorats américains"
 USA_rework_american_protectorates_spirit_desc: "Les États clients assurent la profondeur stratégique de l'Amérique."

 # Décisions supplémentaires
 USA_rework_hemisphere_trade_decisions: "Développement commercial des Amériques"
 USA_rework_hemisphere_trade_decisions_desc: "Financer nos voisins consolidera un bloc économique placé sous la direction de Washington."
 USA_rework_invest_in_mexico: "Investir au Mexique"
 USA_rework_invest_in_mexico_desc: "Développons l'industrie mexicaine et les échanges transfrontaliers."
 USA_rework_invest_in_brazil: "Investir au Brésil"
 USA_rework_invest_in_brazil_desc: "Le Brésil est le partenaire naturel d'un système économique panaméricain."
 USA_rework_invest_in_argentina: "Investir en Argentine"
 USA_rework_invest_in_argentina_desc: "Des capitaux américains peuvent rapprocher Buenos Aires de notre marché."
 USA_rework_aid_italy: "Aider à reconstruire l'Italie"
 USA_rework_aid_italy_desc: "La reconstruction économique réduira l'influence des extrémistes italiens."
 USA_rework_aid_western_germany: "Reconstruire l'Allemagne occidentale"
 USA_rework_aid_western_germany_desc: "Une Allemagne démocratique et prospère formera le cœur de la reprise européenne."
 USA_rework_rebuild_the_low_countries: "Reconstruire le Benelux"
 USA_rework_rebuild_the_low_countries_desc: "Les économies belge et néerlandaise doivent retrouver leur rôle commercial."
 USA_rework_establish_nasa: "Créer la NASA"
 USA_rework_establish_nasa_desc: "Une agence civile coordonnera les projets spatiaux de la nation."
 USA_rework_launch_explorer_one: "Lancer Explorer 1"
 USA_rework_launch_explorer_one_desc: "Le premier satellite américain démontrera notre capacité scientifique."
 USA_rework_hemisphere_trade_opinion: "Investissements panaméricains"

 # Nouveaux événements
 USA_rework.40.t: "L'investiture d'Alf Landon"
 USA_rework.40.d: "Le nouveau président promet de préserver les réformes utiles sans permettre à l'État fédéral de supplanter l'initiative privée."
 USA_rework.40.a: "Une administration responsable commence."
 USA_rework.41.t: "Un Fair Deal pour les Américains"
 USA_rework.41.d: "Le gouvernement présente un programme de logement, de santé, d'éducation et de protection sociale destiné à prolonger l'héritage du New Deal."
 USA_rework.41.a: "La prospérité doit être partagée."
 USA_rework.42.t: "La doctrine Truman"
 USA_rework.42.d: "Devant le Congrès, le président demande le soutien des États-Unis aux peuples menacés par la coercition et les insurrections communistes."
 USA_rework.42.a: "Nous soutiendrons les peuples libres."
 USA_rework.43.t: "Une nouvelle frontière"
 USA_rework.43.d: "Scientifiques, militaires et industriels présentent un programme national capable de placer les États-Unis à l'avant-garde de la conquête spatiale."
 USA_rework.43.a: "Visons les étoiles."
 USA_rework.44.t: "Proclamation du Commonwealth des peuples"
 USA_rework.44.d: "La révolution se dote d'un nouvel ordre fédéral fondé sur les travailleurs, l'égalité civique et la propriété sociale."
 USA_rework.44.a: "Une nouvelle Amérique est née."
 USA_rework.45.t: "Le siècle impérial américain"
 USA_rework.45.d: "Les victoires américaines ont créé un empire couvrant deux océans. Le régime proclame que cette domination doit devenir permanente."
 USA_rework.45.a: "Le monde appartient aux audacieux."
 USA_rework.46.t: "L'urgence devient permanente"
 USA_rework.46.d: "Le gouvernement affirme que les menaces intérieures et extérieures interdisent tout retour aux limites constitutionnelles ordinaires."
 USA_rework.46.a: "La sécurité avant tout."

 # Descriptions complétées des esprits existants
 USA_rework_america_first_spirit_desc: "Le gouvernement privilégie la puissance intérieure et refuse les engagements étrangers inutiles."
 USA_rework_american_caesar_spirit_desc: "MacArthur concentre entre ses mains l'autorité civile et militaire."
 USA_rework_atlantic_charter_spirit_desc: "Les États-Unis défendent un ordre international fondé sur la coopération et l'autodétermination."
 USA_rework_bretton_woods_spirit_desc: "Les nouvelles institutions monétaires placent le dollar au centre de l'économie mondiale."
 USA_rework_business_lobby_cost_desc: "Le soutien des industriels a exigé des concessions fiscales et réglementaires."
 USA_rework_chinese_cooperation_desc: "Nos forces coopèrent avec les révolutionnaires chinois et apprennent de leur expérience."
 USA_rework_containment_spirit_desc: "La puissance américaine est mobilisée pour contenir l'expansion communiste."
 USA_rework_continental_arsenal_spirit_desc: "L'industrie du continent est organisée pour soutenir une défense autonome."
 USA_rework_every_man_a_king_desc: "Le populisme promet de redistribuer la prospérité tout en renforçant l'État."
 USA_rework_full_desegregation_spirit_desc: "La loi fédérale garantit enfin l'égalité civique dans toute l'Union."
 USA_rework_gi_bill_spirit_desc: "Les anciens combattants reçoivent une aide pour leurs études, leur logement et leur réinsertion."
 USA_rework_global_emancipation_desc: "Washington exige la fin des empires coloniaux et soutient les mouvements de libération."
 USA_rework_global_hegemony_spirit_desc: "Le régime prépare l'Amérique à imposer sa volonté à toutes les grandes puissances."
 USA_rework_hemispheric_hegemony_spirit_desc: "Les forces américaines dominent les Caraïbes et le continent."
 USA_rework_house_divided_desc: "L'intervention extérieure divise une opinion publique encore profondément isolationniste."
 USA_rework_labor_lobby_cost_desc: "Le soutien syndical limite la liberté du gouvernement en matière de production militaire."
 USA_rework_macarthur_emergency_plan_desc: "L'état-major prépare la prise en charge du gouvernement en cas d'effondrement politique."
 USA_rework_manhattan_project_spirit_desc: "Un programme secret concentre scientifiques, ingénieurs et ressources sur l'arme atomique."
 USA_rework_military_lobby_cost_desc: "L'influence accrue des militaires absorbe une partie du capital politique du gouvernement."
 USA_rework_nato_leadership_desc: "Les États-Unis assurent le commandement et la modernisation de l'Alliance atlantique."
 USA_rework_new_confederacy_desc: "Le nouveau régime invoque l'héritage confédéré pour légitimer son autorité."
 USA_rework_pax_americana_desc: "L'aide, le commerce et la puissance américaine structurent le nouvel ordre mondial."
