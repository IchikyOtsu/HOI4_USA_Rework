 # Décisions
 USA_rework_congress_decisions: "Capitol Hill"
 USA_rework_congress_decisions_desc: "Sénat favorable : §Y[?USA_rework_senate_support|0]§!/100 — Chambre favorable : §Y[?USA_rework_house_support|0]§!/435. Une majorité exige 51 sénateurs et 218 représentants."
 USA_rework_foreign_policy_decisions: "Débat de politique étrangère"
 USA_rework_foreign_policy_decisions_desc: "Capacité disponible du prêt-bail : §Y[?USA_rework_lend_lease_capacity|0]§!/10. Elle augmente d'un point chaque mois après le vote de la loi prêt-bail."
 USA_rework_mobilization_decisions: "Mobilisation industrielle"
 USA_rework_war_plans: "War Plans Division"
 USA_rework_reconstruction_decisions: "Programme de reconstruction européenne"
 USA_rework_administration_decisions: "Administration de la défense"
 USA_rework_administration_decisions_desc: "Faire appel aux organisateurs qui transformeront les ressources américaines en puissance militaire."
 USA_rework_cold_war_decisions: "La Guerre froide"
 USA_rework_cold_war_decisions_desc: "Arbitrer entre coexistence diplomatique et engagement mondial contre l'expansion soviétique."
 USA_rework_small_lobbying_effort: "Effort de lobbying ciblé"
 USA_rework_small_lobbying_effort_desc: "Convaincre quelques parlementaires hésitants de soutenir le programme gouvernemental."
 USA_rework_business_lobby: "Négocier avec le lobby des affaires"
 USA_rework_labor_lobby: "Négocier avec les syndicats"
 USA_rework_military_lobby: "Solliciter les industriels de la défense"
 USA_rework_midterm_campaign: "Préparer les élections de mi-mandat"
 USA_rework_fireside_chat: "Causerie au coin du feu"
 USA_rework_lend_lease_britain: "Priorité au prêt-bail britannique"
 USA_rework_lend_lease_britain_desc: "Acheminer machines, matières premières et armements afin que la Grande-Bretagne puisse poursuivre le combat."
 USA_rework_lend_lease_soviet_union: "Étendre le prêt-bail à l'Union soviétique"
 USA_rework_lend_lease_soviet_union_desc: "Camions, locomotives, vivres et équipements aideront l'Armée rouge à soutenir son effort colossal."
 USA_rework_lend_lease_china: "Soutenir la résistance chinoise"
 USA_rework_lend_lease_china_desc: "Maintenir la Chine dans la guerre immobilisera une part importante des forces japonaises."
 USA_rework_embargo_japan: "Geler les avoirs japonais"
 USA_rework_embargo_japan_desc: "Des sanctions économiques répondront à la poursuite de l'expansion japonaise en Asie."
 USA_rework_atlantic_charter: "Signer la Charte de l'Atlantique"
 USA_rework_atlantic_charter_desc: "Roosevelt et Churchill définiront les principes du monde qu'ils souhaitent voir naître après la victoire."
