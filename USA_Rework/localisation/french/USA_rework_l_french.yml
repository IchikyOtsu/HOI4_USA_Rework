 USA_rework_bop_limited_intervention: "Intervention limitée"
 USA_rework_bop_arsenal_democracy: "Arsenal de la démocratie"
 USA_rework_slow_recovery: "Reprise lente"
 USA_rework_slow_recovery_desc: "L'économie se redresse, mais le chômage et les séquelles de la crise restent considérables."
 USA_rework_slow_growth: "Croissance économique lente"
 USA_rework_slow_growth_desc: "La Dépression recule enfin, sans avoir encore libéré tout le potentiel américain."
 USA_rework_peacetime_economy: "Production du temps de paix"
 USA_rework_peacetime_economy_desc: "L'industrie demeure tournée vers le marché civil et réticente à toute mobilisation."
 USA_rework_preparedness_economy: "Programme de préparation"
 USA_rework_preparedness_economy_desc: "Des commandes limitées entretiennent désormais une base industrielle de défense."
 USA_rework_limited_mobilization: "Mobilisation industrielle limitée"
 USA_rework_limited_mobilization_desc: "Les premières conversions d'usines accélèrent l'armement sans bouleverser l'économie civile."
 USA_rework_war_production: "Production de guerre"
 USA_rework_war_production_desc: "Les priorités industrielles nationales sont désormais fixées par les besoins militaires."
 USA_rework_total_war_production: "Production de guerre totale"
 USA_rework_total_war_production_desc: "Toute la capacité du pays est engagée dans l'effort de victoire."
 USA_rework_lend_lease_program: "Administration du prêt-bail"
 USA_rework_lend_lease_program_desc: "Une administration fédérale coordonne l'aide matérielle aux nations dont la défense sert la nôtre."
 USA_rework_new_deal_coalition: "Coalition du New Deal"
 USA_rework_new_deal_coalition_desc: "Ouvriers, agriculteurs, minorités et réformateurs continuent de soutenir le programme de Roosevelt."
 USA_rework_arsenal_of_democracy_spirit: "Arsenal de la démocratie"
 USA_rework_arsenal_of_democracy_spirit_desc: "Les chaînes de montage américaines alimentent la résistance du monde libre."
 USA_rework_fortress_america_spirit: "Forteresse Amérique"
 USA_rework_fortress_america_spirit_desc: "La priorité nationale est la prospérité et la défense du continent."
 USA_rework_continental_defense_spirit: "Défense de l'hémisphère"
 USA_rework_continental_defense_spirit_desc: "Toute invasion du territoire américain rencontrera une défense préparée en profondeur."
 USA_rework_pacific_defense: "Défense avancée du Pacifique"
 USA_rework_pacific_defense_desc: "Bases et doctrines amphibies soutiennent notre présence à travers le Pacifique."
 USA_rework_joint_chiefs_spirit: "Joint Chiefs of Staff"
 USA_rework_joint_chiefs_spirit_desc: "Une structure permanente coordonne les différentes armes."
