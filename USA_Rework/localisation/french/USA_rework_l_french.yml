 USA_rework_rebuilt_monroe_doctrine: "Doctrine Monroe restaurée"
 USA_rework_continental_arsenal_spirit: "Arsenal continental"
 USA_rework_george_marshall: "George C. Marshall"
 USA_rework_george_marshall_desc: "Le chef d'état-major transforme l'US Army en une force capable de mener une guerre mondiale."
 USA_rework_henry_stimson: "Henry L. Stimson"
 USA_rework_henry_stimson_desc: "Le secrétaire à la Guerre apporte expérience, bipartisme et fermeté au cabinet."
 USA_rework_william_knudsen: "William S. Knudsen"
 USA_rework_william_knudsen_desc: "L'ancien dirigeant automobile met les méthodes de la production de masse au service de la défense."
 USA_rework_donald_nelson: "Donald M. Nelson"
 USA_rework_donald_nelson_desc: "Le War Production Board coordonne matières premières, contrats et priorités industrielles."
 USA_rework_ernest_king: "Ernest J. King"
 USA_rework_ernest_king_desc: "L'amiral King impose une direction énergique à une marine engagée sur deux océans."
 USA_rework_henry_arnold: "Henry H. Arnold"
 USA_rework_henry_arnold_desc: "Hap Arnold bâtit une force aérienne indépendante dans les faits, sinon encore dans le droit."
 USA_rework_occupation_duty: "Devoirs d'occupation"
 USA_rework_occupation_duty_desc: "Administrer les territoires vaincus exige des hommes, des ressources et une attention politique constante."
 USA_rework_nsc_68_rearmament: "Réarmement NSC-68"
 USA_rework_nsc_68_rearmament_desc: "Une mobilisation durable doit contenir l'expansion soviétique partout où elle se manifeste."
 USA_rework_atoms_for_peace_spirit: "Atomes pour la paix"
 USA_rework_atoms_for_peace_spirit_desc: "La technologie nucléaire américaine peut aussi servir la recherche civile et la coopération internationale."

