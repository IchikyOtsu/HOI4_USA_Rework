 # Extension militaire
 USA_rework_army_ground_forces: "Créer les Army Ground Forces"
 USA_rework_army_ground_forces_desc: "Un commandement terrestre unifié coordonnera l'entraînement, l'équipement et l'expansion de notre armée."
 USA_rework_strategic_air_forces: "Organiser les forces aériennes stratégiques"
 USA_rework_strategic_air_forces_desc: "L'aviation doit pouvoir frapper l'industrie ennemie très au-delà du front."
 USA_rework_carrier_task_forces: "Groupes aéronavals de porte-avions"
 USA_rework_carrier_task_forces_desc: "Le porte-avions deviendra le centre de groupes navals rapides capables d'opérer dans tout le Pacifique."
 USA_rework_combined_arms_doctrine: "Doctrine interarmes"
 USA_rework_combined_arms_doctrine_desc: "Infanterie, blindés, artillerie et aviation devront agir comme une seule force."
 USA_rework_strategic_bombing_campaign: "Préparer la campagne de bombardement"
 USA_rework_strategic_bombing_campaign_desc: "Une offensive aérienne méthodique privera l'ennemi de sa capacité industrielle."
 USA_rework_amphibious_warfare: "Maîtriser la guerre amphibie"
 USA_rework_amphibious_warfare_desc: "Les Marines et la Navy prépareront les débarquements nécessaires à une guerre transocéanique."
 USA_rework_war_plans_division: "War Plans Division"
 USA_rework_war_plans_division_desc: "Une division permanente préparera des plans adaptés à chaque adversaire potentiel."

 # Landon et l'économie conservatrice
 USA_rework_elect_alf_landon: "Élire Alf Landon"
 USA_rework_elect_alf_landon_desc: "Landon promet une reprise respectueuse de la Constitution, de l'entreprise privée et de la prudence extérieure."
 USA_rework_restore_gold_standard: "Rétablir l'étalon-or"
 USA_rework_restore_gold_standard_desc: "Une monnaie à nouveau liée à l'or rassurera les créanciers, au prix d'une politique économique plus rigide."
 USA_rework_unleash_private_enterprise: "Libérer l'entreprise privée"
 USA_rework_unleash_private_enterprise_desc: "Les investissements privés prendront le relais des grands programmes fédéraux."
 USA_rework_hemisphere_trade_bloc: "Bloc commercial hémisphérique"
 USA_rework_hemisphere_trade_bloc_desc: "La prospérité des Amériques peut garantir notre sécurité sans nous entraîner dans les guerres européennes."

 # Après-guerre et Guerre froide
 USA_rework_fair_deal: "Le Fair Deal"
 USA_rework_fair_deal_desc: "Prolongeons les réformes sociales du New Deal pour les vétérans et les familles américaines."
 USA_rework_occupation_zones: "Administrer les zones d'occupation"
 USA_rework_occupation_zones_desc: "La victoire impose aux États-Unis la responsabilité de stabiliser les territoires vaincus."
 USA_rework_truman_doctrine_focus: "La doctrine Truman"
 USA_rework_truman_doctrine_focus_desc: "Nous soutiendrons les peuples libres menacés par la coercition totalitaire."
 USA_rework_interstate_highway_system: "Réseau autoroutier inter-États"
 USA_rework_interstate_highway_system_desc: "Un réseau continental moderne servira autant la croissance que la défense nationale."
 USA_rework_democratize_defeated_powers: "Démocratiser les puissances vaincues"
 USA_rework_democratize_defeated_powers_desc: "La reconstruction doit transformer les anciens ennemis en démocraties stables."
 USA_rework_berlin_airlift_focus: "Le pont aérien de Berlin"
 USA_rework_berlin_airlift_focus_desc: "Nous ravitaillerons Berlin aussi longtemps qu'il le faudra pour briser le blocus."
 USA_rework_atoms_for_peace_focus: "Atomes pour la paix"
 USA_rework_atoms_for_peace_focus_desc: "La puissance nucléaire américaine doit aussi servir la science et l'énergie civile."
 USA_rework_nsc_68_focus: "Adopter NSC-68"
 USA_rework_nsc_68_focus_desc: "La confrontation soviétique exige un effort durable de réarmement économique et militaire."
 USA_rework_space_program: "Un programme spatial national"
 USA_rework_space_program_desc: "Fusées, satellites et recherche avancée ouvriront une nouvelle frontière américaine."
 USA_rework_korean_commitment: "L'engagement coréen"
 USA_rework_korean_commitment_desc: "Une agression en Corée mettrait à l'épreuve toute la politique de containment."

 # Fins des voies alternatives
 USA_rework_peoples_commonwealth: "Le Commonwealth des peuples"
 USA_rework_peoples_commonwealth_desc: "La nouvelle république fédérera travailleurs, minorités et communautés dans un ordre socialiste américain."
 USA_rework_workers_arsenal: "L'arsenal des travailleurs"
 USA_rework_workers_arsenal_desc: "Une industrie dirigée par les travailleurs produira les armes de la révolution."
 USA_rework_liberate_the_americas: "Libérer les Amériques"
 USA_rework_liberate_the_americas_desc: "Les oligarchies du continent ne doivent plus gouverner à l'abri de la doctrine Monroe."
 USA_rework_world_revolution: "La révolution mondiale"
 USA_rework_world_revolution_desc: "L'Amérique rouge dispose des moyens de soutenir les peuples insurgés du monde entier."
 USA_rework_subjugate_canada: "Soumettre le Canada"
 USA_rework_subjugate_canada_desc: "Aucune puissance liée à Londres ne doit subsister sur notre frontière septentrionale."
 USA_rework_pacific_empire: "Un empire du Pacifique"
 USA_rework_pacific_empire_desc: "La domination de l'océan Pacifique assurera les ressources et la sécurité de notre nouvel ordre."
 USA_rework_imperial_american_century: "Le siècle impérial américain"
 USA_rework_imperial_american_century_desc: "Le monde doit accepter la primauté incontestée de la puissance américaine."
 USA_rework_military_industrial_state: "L'État militaro-industriel"
 USA_rework_military_industrial_state_desc: "L'industrie, l'armée et le gouvernement seront intégrés dans une structure permanente de sécurité nationale."
 USA_rework_guardians_of_republic: "Gardiens de la République"
 USA_rework_guardians_of_republic_desc: "Les forces armées se retireront de la politique, mais garantiront la survie de l'ordre constitutionnel."
 USA_rework_permanent_emergency: "L'urgence permanente"
 USA_rework_permanent_emergency_desc: "Les périls du monde justifient le maintien indéfini des pouvoirs d'exception."
 USA_rework_american_protectorates: "Les protectorats américains"
 USA_rework_american_protectorates_desc: "Un réseau d'États protégés étendra la doctrine Monroe au-delà du continent."

