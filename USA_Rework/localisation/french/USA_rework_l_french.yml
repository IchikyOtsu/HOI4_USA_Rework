l_french:
 USA_rework_recovery: "Relancer la nation"
 USA_rework_recovery_desc: "Les États-Unis sortent de la crise par une action fédérale déterminée."
 USA_rework_public_works: "Grands travaux fédéraux"
 USA_rework_public_works_desc: "Mobiliser les ressources nationales pour moderniser les infrastructures."
 USA_rework_arsenal_democracy: "Arsenal de la démocratie"
 USA_rework_arsenal_democracy_desc: "Préparer l'industrie américaine aux menaces qui pèsent sur le monde libre."
 USA_rework_federal_reform: "Réformer la fédération"
 USA_rework_federal_reform_desc: "Rendre l'administration fédérale plus efficace et plus légitime."
 USA_rework_wartime_economy: "Économie de guerre"
 USA_rework_wartime_economy_desc: "Faire de l'industrie américaine le moteur de la victoire."
 USA_rework_industrial_mobilization: "Mobilisation industrielle"
 USA_rework_economic_programs: "Programme de reconstruction américain"
 USA_rework_expand_public_works: "Étendre les grands travaux"
 USA_rework_expand_public_works_desc: "Financer une nouvelle vague d'investissements fédéraux."

 # Arbre de priorités
 USA_rework_new_deal_continues: "Poursuivre le New Deal"
 USA_rework_new_deal_continues_desc: "Le gouvernement fédéral poursuivra la reconstruction économique tout en préparant la nation aux crises à venir."
 USA_rework_wpa: "Works Progress Administration"
 USA_rework_wpa_desc: "Des programmes fédéraux de travaux publics remettront les Américains au travail et moderniseront le pays."
 USA_rework_social_security: "Renforcer la sécurité sociale"
 USA_rework_social_security_desc: "Une protection durable contre la vieillesse et le chômage consolidera le contrat social américain."
 USA_rework_agricultural_adjustment: "Agricultural Adjustment Act"
 USA_rework_agricultural_adjustment_desc: "La stabilisation des prix agricoles aidera les campagnes à sortir de la Dépression."
 USA_rework_fair_labor_standards: "Fair Labor Standards Act"
 USA_rework_fair_labor_standards_desc: "Un salaire minimum et des normes de travail fédérales feront bénéficier les ouvriers de la reprise."
 USA_rework_scientific_office: "Office de la recherche scientifique"
 USA_rework_scientific_office_desc: "L'État doit mieux coordonner les universités, l'industrie et les besoins stratégiques."
 USA_rework_manhattan_groundwork: "Premiers travaux atomiques"
 USA_rework_manhattan_groundwork_desc: "Les progrès de la physique nucléaire imposent un programme de recherche discret mais ambitieux."
 USA_rework_neutrality_acts: "Les lois de neutralité"
 USA_rework_neutrality_acts_desc: "Le Congrès entend empêcher qu'une nouvelle guerre européenne n'entraîne l'Amérique."
 USA_rework_limited_intervention: "Intervention limitée"
 USA_rework_limited_intervention_desc: "Sans entrer en guerre, nous pouvons soutenir progressivement les démocraties menacées."
 USA_rework_destroyers_for_bases: "Destroyers contre bases"
 USA_rework_destroyers_for_bases_desc: "Des destroyers anciens renforceront la Grande-Bretagne en échange de droits sur des bases atlantiques."
 USA_rework_lend_lease_act: "Loi prêt-bail"
 USA_rework_lend_lease_act_desc: "L'Amérique deviendra l'arsenal de ceux dont la défense est essentielle à la nôtre."
 USA_rework_arsenal_of_democracy: "Arsenal de la démocratie"
 USA_rework_arsenal_of_democracy_desc: "La puissance productive américaine doit équiper les nations qui résistent à l'agression."
 USA_rework_fortress_america: "Forteresse Amérique"
 USA_rework_fortress_america_desc: "Deux océans et une industrie immense nous permettront de défendre le continent sans guerres étrangères."
 USA_rework_hemisphere_first: "L'hémisphère d'abord"
 USA_rework_hemisphere_first_desc: "La doctrine Monroe demeure le socle de notre sécurité collective."
 USA_rework_continental_defense: "Défense continentale"
 USA_rework_continental_defense_desc: "Ports, aérodromes et garnisons rendront toute attaque contre le continent vouée à l'échec."
 USA_rework_defense_industrial_base: "Base industrielle de défense"
 USA_rework_defense_industrial_base_desc: "Une capacité militaire minimale doit être constituée avant que la crise mondiale n'atteigne nos côtes."
 USA_rework_giant_wakes: "Le géant se réveille"
 USA_rework_giant_wakes_desc: "L'industrie américaine commence sa conversion méthodique vers les besoins de la défense."
 USA_rework_usace_projects: "Projets du Corps des ingénieurs"
 USA_rework_usace_projects_desc: "Le Corps des ingénieurs coordonnera usines, routes, ports et terrains d'aviation."
 USA_rework_wartime_industry: "Industrie de guerre"
 USA_rework_wartime_industry_desc: "La nation en guerre doit mobiliser sa production à une échelle encore jamais atteinte."
 USA_rework_war_department: "Réorganiser le War Department"
 USA_rework_war_department_desc: "Une future guerre interarmées exige une direction, une planification et une logistique modernes."
 USA_rework_selective_training_act: "Selective Training and Service Act"
 USA_rework_selective_training_act_desc: "La première conscription en temps de paix de notre histoire donnera à l'armée les effectifs nécessaires."
 USA_rework_army_modernization: "Moderniser l'US Army"
 USA_rework_army_modernization_desc: "Chars, motorisation et communications transformeront une petite armée en force moderne."
 USA_rework_army_air_corps: "Développer l'Army Air Corps"
 USA_rework_army_air_corps_desc: "La maîtrise du ciel et la production aéronautique seront décisives dans la guerre moderne."
 USA_rework_two_ocean_navy: "Two-Ocean Navy Act"
 USA_rework_two_ocean_navy_desc: "La flotte doit pouvoir mener simultanément une guerre dans l'Atlantique et dans le Pacifique."
 USA_rework_pacific_bases: "Fortifier les avant-postes du Pacifique"
 USA_rework_pacific_bases_desc: "Hawaï, Guam et les Philippines sont les sentinelles avancées de notre ligne de défense."
 USA_rework_rainbow_plans: "Les plans Rainbow"
 USA_rework_rainbow_plans_desc: "Les hypothèses colorées doivent céder la place à des plans conjoints adaptés à une guerre mondiale."
 USA_rework_joint_chiefs: "État-major interarmées"
 USA_rework_joint_chiefs_desc: "L'armée, la marine et l'aviation conduiront la guerre selon une stratégie commune."
 USA_rework_manhattan_project: "Projet Manhattan"
 USA_rework_manhattan_project_desc: "Les meilleurs scientifiques du monde libre tenteront de maîtriser l'énergie de l'atome avant nos ennemis."
 USA_rework_victory_program: "Victory Program"
 USA_rework_victory_program_desc: "Nos besoins militaires et ceux des Alliés seront traduits en un programme productif unique."
 USA_rework_gi_bill: "GI Bill of Rights"
 USA_rework_gi_bill_desc: "Études, logement et réinsertion donneront aux vétérans les moyens de construire l'Amérique d'après-guerre."
 USA_rework_bretton_woods: "Le système de Bretton Woods"
 USA_rework_bretton_woods_desc: "Un ordre monétaire stable empêchera le retour des rivalités économiques des années trente."
 USA_rework_united_nations: "Fonder les Nations unies"
 USA_rework_united_nations_desc: "Une organisation mondiale durable doit succéder aux alliances provisoires du temps de guerre."
 USA_rework_orderly_demobilization: "Démobilisation ordonnée"
 USA_rework_orderly_demobilization_desc: "Le retour à la paix doit éviter à la fois le chômage de masse et le maintien inutile d'une économie de guerre."
 USA_rework_marshall_plan: "Plan Marshall"
 USA_rework_marshall_plan_desc: "La reconstruction économique de l'Europe libre est indispensable à sa stabilité politique."
 USA_rework_containment: "Politique d'endiguement"
 USA_rework_containment_desc: "La pression soviétique doit être contenue par une combinaison de puissance, d'aide et d'alliances."
 USA_rework_north_atlantic_treaty: "Traité de l'Atlantique Nord"
 USA_rework_north_atlantic_treaty_desc: "Une attaque contre une démocratie atlantique sera désormais considérée comme une attaque contre toutes."

