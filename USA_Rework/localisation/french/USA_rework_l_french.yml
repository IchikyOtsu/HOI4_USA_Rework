 # Événements
 USA_rework.1.t: "Une causerie au coin du feu"
 USA_rework.1.d: "Le président s'adresse directement aux foyers américains. Il peut préparer l'opinion aux périls extérieurs, ou promettre que le pays restera à l'écart des guerres étrangères."
 USA_rework.1.a: "Nous devons devenir l'arsenal des démocraties."
 USA_rework.1.b: "Aucun garçon américain ne sera envoyé à l'étranger."
 USA_rework.2.t: "La campagne de mi-mandat"
 USA_rework.2.d: "Les électeurs jugent le programme du gouvernement, la reprise et sa conduite des affaires internationales. Le nouvel équilibre du Congrès en dépend."
 USA_rework.2.a: "Les électeurs renouvellent leur confiance."
 USA_rework.2.b: "L'opposition gagne du terrain."
 USA_rework.10.t: "La France au bord de la défaite"
 USA_rework.10.d: "L'effondrement de l'armée française bouleverse le débat américain. Si la Grande-Bretagne tombe à son tour, l'Atlantique ne suffira peut-être plus à nous protéger."
 USA_rework.10.a: "L'Amérique doit se préparer."
 USA_rework.11.t: "Guerre dans le Pacifique"
 USA_rework.11.d: "Les forces japonaises ont engagé les États-Unis. En quelques heures, le débat isolationniste s'est effondré : le pays exige désormais une victoire complète."
 USA_rework.11.a: "Le géant est réveillé."
 USA_rework.12.t: "Le discours de la quarantaine"
 USA_rework.12.d: "Face à la multiplication des agressions, le président suggère que les nations éprises de paix mettent collectivement les agresseurs en quarantaine. La réaction isolationniste est immédiate."
 USA_rework.12.a: "Les agresseurs ne doivent plus agir impunément."
 USA_rework.12.b: "Ce discours nous rapproche dangereusement de la guerre."
 USA_rework.13.t: "La guerre éclate en Europe"
 USA_rework.13.d: "L'Allemagne est de nouveau en guerre avec ses voisins. Le Congrès et l'opinion doivent décider si la neutralité suffit encore à garantir la sécurité des États-Unis."
 USA_rework.13.a: "Préparons-nous à soutenir les démocraties."
 USA_rework.13.b: "Cette guerre n'est pas la nôtre."
 USA_rework.30.t: "La révolution américaine"
 USA_rework.30.d: "Les gouverneurs, officiers et industriels hostiles au nouvel ordre ont refusé l'autorité fédérale. Une seconde guerre civile décidera si la révolution peut survivre."
 USA_rework.30.a: "L'Amérique appartiendra aux travailleurs."
 USA_rework.31.t: "L'Union se fracture"
 USA_rework.31.d: "Les forces fidèles à l'ancien gouvernement ont rejeté notre prise de pouvoir. Les milices nationalistes se mobilisent pour imposer un nouvel ordre américain."
 USA_rework.31.a: "La victoire ou la disparition."
 USA_rework.32.t: "MacArthur assume le commandement"
 USA_rework.32.d: "Le général MacArthur proclame un gouvernement d'urgence. Plusieurs États refusent son autorité et mobilisent leurs gardes nationales."
 USA_rework.32.a: "L'Union doit être sauvée."

