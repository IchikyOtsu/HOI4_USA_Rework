 USA_rework_interstate_highways: "Autoroutes inter-États"
 USA_rework_interstate_highways_desc: "Un vaste réseau facilite la circulation civile, militaire et logistique."
 USA_rework_democratic_reconstruction: "Reconstruction démocratique"
